<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>샤이닝키즈 암송</title>
<meta name="description" content="2026 가을학기 샤이닝키즈 성경암송 연습 앱 — 주차별 말씀, 읽어주기, 첫글자·가리기 연습">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F59E2D">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="암송">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one-column mobile-first app — week list → verse practice screen with 3 modes (전체보기/첫글자/가리기) */
:root{
  --bg:#FFFDF5;
  --card:#FFFFFF;
  --fg:#4A3B2A;
  --muted:#9C8A72;
  --line:#F0E6D2;
  --accent:#F59E2D;       /* shining orange */
  --accent-soft:#FFF3DF;
  --green:#5BA865;
  --green-soft:#EAF5EB;
  --sky:#DDEEF9;
  --pink:#F9E3E6;
  --done:#5BA865;
  --font-display:'Jua',sans-serif;
  --font-body:'Gowun Dodum','Noto Sans KR',sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#241E16; --card:#2F2820; --fg:#F2E8D8; --muted:#A79579;
    --line:#423828; --accent:#F5A94A; --accent-soft:#3D3122;
    --green:#7CC286; --green-soft:#2C3A2E; --sky:#2A3642; --pink:#423036; --done:#7CC286;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#241E16; --card:#2F2820; --fg:#F2E8D8; --muted:#A79579;
  --line:#423828; --accent:#F5A94A; --accent-soft:#3D3122;
  --green:#7CC286; --green-soft:#2C3A2E; --sky:#2A3642; --pink:#423036; --done:#7CC286;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%}
[hidden]{display:none!important}
img{max-width:100%}
body{
  margin:0;
  background:var(--bg); color:var(--fg);
  font-family:var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 32px;
  line-height:1.6;
}
.wrap{max-width:560px;margin:0 auto}

/* header */
header{display:flex;flex-direction:column;align-items:center;gap:2px;padding-block:22px 10px;text-align:center}
.logo{font-family:var(--font-display);font-size:30px;letter-spacing:.5px}
.logo .s{color:var(--green)} .logo .k{color:var(--accent)}
.sub{font-size:13px;color:var(--muted)}
.theme-verse{
  margin-top:12px;background:var(--accent-soft);border:1.5px dashed var(--accent);
  border-radius:16px;padding:12px 16px;font-size:14.5px;width:100%;
}
.theme-verse b{display:block;font-family:var(--font-display);font-size:13px;color:var(--accent);letter-spacing:1px;margin-bottom:4px}
.theme-verse .ref{display:block;margin-top:4px;font-size:12.5px;color:var(--muted)}

/* week list */
.weeks{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.week-card{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--card);border:1.5px solid var(--line);border-radius:16px;
  padding:13px 14px;font:inherit;color:inherit;cursor:pointer;
}
.week-card:active{transform:scale(.985)}
.wk-badge{
  flex:none;width:52px;height:52px;border-radius:14px;background:var(--accent-soft);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--font-display);color:var(--accent);line-height:1.15;
}
.wk-badge .n{font-size:19px}
.wk-badge .w{font-size:9.5px;letter-spacing:1px}
.wk-main{flex:1;min-width:0}
.wk-ref{font-family:var(--font-display);font-size:17px}
.wk-date{font-size:12.5px;color:var(--muted)}
.wk-state{flex:none;font-size:20px;color:var(--line)}
.week-card.done{border-color:var(--done)}
.week-card.done .wk-state{color:var(--done)}
.week-card.party .wk-badge{background:var(--pink);color:#D46A8A}
.week-card.today{border-color:var(--accent)}
.today-tag{display:inline-block;font-size:10.5px;background:var(--accent);color:#fff;border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:2px}

.sec-label{font-family:var(--font-display);font-size:15px;color:var(--muted);margin:22px 2px 0;letter-spacing:1px}

/* progress */
.progress{margin-top:16px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px}
.progress .row{display:flex;justify-content:space-between;align-items:baseline;font-size:13.5px}
.progress .row b{font-family:var(--font-display);color:var(--green);font-size:16px}
.bar{height:10px;border-radius:99px;background:var(--line);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .4s}

/* ===== practice screen ===== */
#practice{display:flex;flex-direction:column;gap:14px;padding-block:16px 0}
#practice[hidden]{display:none!important}
.p-top{display:flex;align-items:center;gap:10px}
.back{
  flex:none;border:1.5px solid var(--line);background:var(--card);color:var(--fg);
  border-radius:12px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer;
}
.p-title{flex:1;min-width:0}
.p-title .r{font-family:var(--font-display);font-size:21px}
.p-title .d{font-size:12.5px;color:var(--muted)}

/* 모드 탭 고정: 스크롤해도 화면 위에 붙어 있음 */
.modes-sticky{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  background:var(--bg);
  margin-left:calc(-1*max(16px,env(safe-area-inset-left,0px)));
  margin-right:calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:8px 6px;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.modes{display:flex;gap:6px;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:5px;box-shadow:0 3px 10px rgba(0,0,0,.07)}
.modes button{
  flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-size:14px;
  font-family:var(--font-display);border-radius:10px;padding:8px 4px;cursor:pointer;
}
.modes button.on{background:var(--accent);color:#fff}

.hint{font-size:12.5px;color:var(--muted);text-align:center}

/* 말씀 이야기(스토리텔링) 카드 */
.story{background:var(--green-soft);border:1.5px dashed var(--green);border-radius:16px;padding:12px 14px;font-size:14.5px;display:flex;gap:10px;align-items:flex-start;line-height:1.7}
.story .s-main{flex:1;min-width:0}
.story b{display:block;font-family:var(--font-display);font-size:12.5px;color:var(--green);letter-spacing:1px;margin-bottom:2px}
.story .s-title{font-family:var(--font-display);font-size:16px;margin-bottom:4px}

.verses{display:flex;flex-direction:column;gap:12px}
.vcard{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;gap:10px}
.vnum{
  flex:none;width:28px;height:28px;border-radius:99px;background:var(--green-soft);color:var(--green);
  font-family:var(--font-display);font-size:14px;display:flex;align-items:center;justify-content:center;margin-top:2px;
}
.vspeak{
  flex:none;align-self:flex-start;border:1.5px solid var(--line);background:var(--card);
  border-radius:10px;width:36px;height:36px;font-size:16px;cursor:pointer;margin-top:0;
}
.vspeak.playing{background:var(--accent);border-color:var(--accent)}
.vtext{flex:1;min-width:0;font-size:17px;line-height:1.85;word-break:keep-all}

/* 그림 암송 모드 */
.vcard.withpic{flex-direction:column;gap:10px}
.vpic{width:100%;border-radius:12px;overflow:hidden;background:var(--accent-soft)}
.vpic svg{display:block;width:100%;height:auto}
.vrow{display:flex;gap:10px;width:100%}

/* hide mode word chips */
.vtext .w{border-radius:6px;cursor:pointer;transition:background .15s,color .15s;padding:0 1px}
.vtext .w.hid{background:var(--accent-soft);color:transparent;border-bottom:2px solid var(--accent);user-select:none}
:root[data-theme="dark"] .vtext .w.hid, body .vtext .w.hid{text-shadow:none}
.vtext .w.first .rest{color:transparent;background:var(--sky);border-radius:4px;border-bottom:2px solid var(--green)}

.p-actions{display:flex;gap:8px;flex-wrap:wrap}
.p-actions button{
  flex:1;min-width:120px;border:0;border-radius:14px;padding:13px 10px;font:inherit;
  font-family:var(--font-display);font-size:15.5px;cursor:pointer;
}
.btn-done{background:var(--green);color:#fff}
.btn-done.off{background:var(--green-soft);color:var(--green)}
.btn-shuffle{background:var(--accent-soft);color:var(--accent)}
.btn-listen{background:var(--sky);color:var(--fg)}
.btn-listen.playing{background:var(--accent);color:#fff}
.speed{display:flex;align-items:center;gap:8px;justify-content:center;font-size:13px;color:var(--muted)}
.speed input{width:140px;accent-color:var(--accent)}
.loop-btn{border:1.5px solid var(--line);background:var(--card);color:var(--muted);border-radius:99px;padding:4px 12px;font-family:var(--font-display);font-size:13px;cursor:pointer}
.loop-btn.on{background:var(--accent);border-color:var(--accent);color:#fff}

.cheer{
  text-align:center;font-family:var(--font-display);font-size:15px;color:var(--accent);
  background:var(--accent-soft);border-radius:14px;padding:10px;display:none;
}
.cheer.show{display:block;animation:pop .35s}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion: reduce){.cheer.show{animation:none}.bar i{transition:none}}

footer{margin-top:28px;text-align:center;font-size:12px;color:var(--muted)}
footer b{font-family:var(--font-display);color:var(--accent)}
</style>
</head>
<body>

<div class="wrap">

<div id="home">
  <header>
    <div class="logo"><span class="s">Shining</span> <span class="k">Kids</span></div>
    <div class="sub">2026 가을학기 · 부모님과 함께하는 성경암송학교</div>
    <div class="theme-verse">
      <b>주제말씀</b>
      참 빛 곧 세상에 와서 각 사람에게 비추는 빛이 있었나니
      <span class="ref">요한복음 1장 9절</span>
    </div>
  </header>

  <div class="progress">
    <div class="row"><span>암송 진행</span><b id="prog-txt">0 / 7</b></div>
    <div class="bar"><i id="prog-bar" style="width:0%"></i></div>
  </div>

  <div class="sec-label">주차별 암송 말씀</div>
  <div class="weeks" id="week-list"></div>

  <div class="sec-label">기본암송</div>
  <div class="weeks" id="basic-list"></div>

  <footer>암송은 <b>즐겁게!</b> 선포는 <b>힘차게!</b><br>부천 온누리교회 차세대 · 2026-2 Shining Kids</footer>
</div>

<div id="practice" hidden>
  <div class="p-top">
    <button class="back" id="btn-back">← 목록</button>
    <div class="p-title">
      <div class="r" id="p-ref"></div>
      <div class="d" id="p-date"></div>
    </div>
  </div>

  <div class="story" id="story-card">
    <div class="s-main">
      <b>📖 말씀 이야기</b>
      <div class="s-title" id="story-title"></div>
      <div id="story-text"></div>
    </div>
    <button class="vspeak" id="btn-story" aria-label="이야기 읽어주기">🔊</button>
  </div>

  <div class="modes-sticky">
    <div class="modes" id="modes">
      <button data-mode="full" class="on">전체 보기</button>
      <button data-mode="pic">그림</button>
      <button data-mode="first">첫 글자만</button>
      <button data-mode="hide">가리기</button>
    </div>
  </div>
  <div class="hint" id="p-hint">말씀을 소리내어 읽어 보세요</div>

  <div class="verses" id="verse-box"></div>

  <div class="cheer" id="cheer">🎉 참 잘했어요! 선포는 힘차게!</div>

  <div class="p-actions">
    <button class="btn-listen" id="btn-listen">🔊 전체 듣기</button>
    <button class="btn-shuffle" id="btn-random">🎲 빈칸 바꾸기</button>
    <button class="btn-done off" id="btn-done">암송 완료 ✔</button>
  </div>
  <div class="speed">
    <span>🐢 느리게</span>
    <input type="range" id="tts-rate" min="0.6" max="1.2" step="0.1" value="0.9">
    <span>빠르게 🐰</span>
    <button id="btn-loop" class="loop-btn" title="전체 듣기 자동 반복">🔁 반복</button>
  </div>
</div>

</div>

<script>
const WEEKS=[
 {id:"w1",week:1,date:"10월 17일",iso:"2026-10-17",ref:"시편 100:1-5",
  st:"하나님께 감사해요",
  story:"이 시는 온 세상 사람들을 하나님 앞으로 초대하는 찬양이에요. 목자님이 양을 지켜 주듯 하나님이 우리를 지켜 주시죠. 우리는 하나님이 만드신 하나님의 양 떼! 그래서 감사함으로, 찬송함으로 하나님께 나아가는 거예요.",
  verses:[
  [1,"온 땅이여 여호와께 즐거운 찬송을 부를지어다"],
  [2,"기쁨으로 여호와를 섬기며 노래하면서 그의 앞에 나아갈지어다"],
  [3,"여호와가 우리 하나님이신 줄 너희는 알지어다 그는 우리를 지으신 이요 우리는 그의 것이니 그의 백성이요 그의 기르시는 양이로다"],
  [4,"감사함으로 그의 문에 들어가며 찬송함으로 그의 궁정에 들어가서 그에게 감사하며 그의 이름을 송축할지어다"],
  [5,"여호와는 선하시니 그의 인자하심이 영원하고 그의 성실하심이 대대에 이르리로다"]]},
 {id:"w2",week:2,date:"10월 24일",iso:"2026-10-24",ref:"마태복음 5:1-10",
  st:"산 위의 행복 선언, 팔복",
  story:"예수님이 산 위에서 '진짜 행복'이 무엇인지 가르쳐 주셨어요. 세상은 힘세고 돈 많은 사람이 행복하다고 말하지만, 예수님은 마음이 가난한 사람, 온유한 사람, 화평하게 하는 사람이 복이 있다고 하셨어요. 여덟 가지 복, 그래서 '팔복'이에요!",
  verses:[
  [1,"예수께서 무리를 보시고 산에 올라가 앉으시니 제자들이 나아온지라"],
  [2,"입을 열어 가르쳐 이르시되"],
  [3,"심령이 가난한 자는 복이 있나니 천국이 그들의 것임이요"],
  [4,"애통하는 자는 복이 있나니 그들이 위로를 받을 것임이요"],
  [5,"온유한 자는 복이 있나니 그들이 땅을 기업으로 받을 것임이요"],
  [6,"의에 주리고 목마른 자는 복이 있나니 그들이 배부를 것임이요"],
  [7,"긍휼히 여기는 자는 복이 있나니 그들이 긍휼히 여김을 받을 것임이요"],
  [8,"마음이 청결한 자는 복이 있나니 그들이 하나님을 볼 것임이요"],
  [9,"화평하게 하는 자는 복이 있나니 그들이 하나님의 아들이라 일컬음을 받을 것임이요"],
  [10,"의를 위하여 박해를 받은 자는 복이 있나니 천국이 그들의 것임이라"]]},
 {id:"w3",week:3,date:"10월 31일",iso:"2026-10-31",ref:"요한복음 1:1-6",
  st:"태초부터 계신 말씀",
  story:"요한복음은 세상이 만들어지기도 전, 아주아주 먼 옛날 이야기부터 시작해요. 여기서 '말씀'은 바로 예수님! 예수님은 처음부터 하나님과 함께 계셨고, 모든 것을 만드셨어요. 그리고 예수님은 어둠도 이길 수 없는 빛이세요.",
  verses:[
  [1,"태초에 말씀이 계시니라 이 말씀이 하나님과 함께 계셨으니 이 말씀은 곧 하나님이시니라"],
  [2,"그가 태초에 하나님과 함께 계셨고"],
  [3,"만물이 그로 말미암아 지은 바 되었으니 지은 것이 하나도 그가 없이는 된 것이 없느니라"],
  [4,"그 안에 생명이 있었으니 이 생명은 사람들의 빛이라"],
  [5,"빛이 어둠에 비치되 어둠이 깨닫지 못하더라"],
  [6,"하나님께로부터 보내심을 받은 사람이 있으니 그의 이름은 요한이라"]]},
 {id:"w4",week:4,date:"11월 7일",iso:"2026-11-07",ref:"요한복음 1:7-13",
  st:"참 빛을 맞이한 사람들",
  story:"세례 요한은 사람들에게 '빛이 오신다!' 하고 알려 주는 증인이었어요. 참 빛이신 예수님이 세상에 오셨는데, 많은 사람이 알아보지 못했어요. 하지만 예수님을 영접하고 믿는 사람에게는 놀라운 선물이 있어요 — 하나님의 자녀가 되는 권세예요!",
  verses:[
  [7,"그가 증언하러 왔으니 곧 빛에 대하여 증언하고 모든 사람이 자기로 말미암아 믿게 하려 함이라"],
  [8,"그는 이 빛이 아니요 이 빛에 대하여 증언하러 온 자라"],
  [9,"참 빛 곧 세상에 와서 각 사람에게 비추는 빛이 있었나니"],
  [10,"그가 세상에 계셨으며 세상은 그로 말미암아 지은 바 되었으되 세상이 그를 알지 못하였고"],

/* 암송이 표 날짜보다 1주 늦게 진행 → 각 주차 유효기간을 7일 뒤로 밀어서 계산 */
const DELAY_DAYS=7;
function shifted(iso){
  const d=new Date(iso+"T00:00:00");
  d.setDate(d.getDate()+DELAY_DAYS);
  return d.toISOString().slice(0,10);
}
function nearestWeek(){
  for(const w of WEEKS){ if(todayISO<=shifted(w.iso)) return w.id }
  return null;
}

/* 읽기 규칙:
   1) "N절" 먼저 읽고 잠깐 쉼
   2) 본문 읽기 (서너 단어씩 끊어 또박또박)
   3) 다음 절로 넘어가기 전 한 템포 쉼 */
const PAUSE_AFTER_NUM=300, PAUSE_BETWEEN_VERSES=500;
let playingBtn=null, seqTimer=null, seqToken=0;
function stopSpeak(){
  seqToken++;                       // 진행 중인 시퀀스 무효화
  if(seqTimer){clearTimeout(seqTimer);seqTimer=null}
  if(synth)synth.cancel();
  if(playingBtn){playingBtn.classList.remove("playing");
    if(playingBtn.id==="btn-listen")playingBtn.textContent="🔊 전체 듣기";
    else playingBtn.textContent="🔊";
    playingBtn=null;}
}
/* segments: [{text, pauseAfter(ms)}, ...] 를 순서대로 읽기 */
function speakSeq(segments,btn,activeLabel){
  if(!synth){hint.textContent="이 기기에서는 읽어주기를 지원하지 않아요 😢";return}
  if(playingBtn===btn){stopSpeak();return}
  stopSpeak();
  playingBtn=btn; btn.classList.add("playing"); btn.textContent=activeLabel;
  const myToken=seqToken;
  let i=0;
  function next(){
    if(myToken!==seqToken)return;           // 중간에 멈췄으면 종료
    if(i>=segments.length){
      if(loopOn&&btn&&btn.id==="btn-listen"){i=0;seqTimer=setTimeout(next,1500);return}
      stopSpeak();return
    }
    const seg=segments[i++];
    const u=new SpeechSynthesisUtterance(seg.text);
    u.lang="ko-KR"; if(koVoice)u.voice=koVoice;
    u.rate=getRate(); u.pitch=1.05;
    u.onend=()=>{ if(myToken!==seqToken)return;
      seqTimer=setTimeout(next,seg.pauseAfter||0); };
    u.onerror=stopSpeak;
    synth.speak(u);
  }
  next();
}
/* 성경 주소 읽기: "마태복음 5:1-10" → "마태복음 5장 1절부터 10절까지" (시편은 "편") */
function refSpeech(ref){
  const unit=ref.indexOf("시편")===0?"편":"장";
  return ref
    .replace(/(\d+):(\d+)-(\d+)/,"$1"+unit+" $2절부터 $3절까지")
    .replace(/(\d+):(\d+)/,"$1"+unit+" $2절");
}
/* 구절 제목: "마태복음 5장 1절" */
function verseTitle(ref,n){
  const m=ref.match(/^(.+?)\s+(\d+):/);
  if(!m) return n+"절";
  const unit=ref.indexOf("시편")===0?"편":"장";
  return m[1]+" "+m[2]+unit+" "+n+"절";
}
/* 서너 단어씩 묶어 사이에 짧은 쉼표 → 또박하되 텀은 짧게 */
function slowText(t){
  const ws=t.split(" ").filter(Boolean), out=[];
  for(let i=0;i<ws.length;i+=3) out.push(ws.slice(i,i+3).join(" "));
  return out.join(", ");
}
/* 한 절 = ["N절"(쉼)] + [본문] */
function verseSegments(n,text,last){
  return [
    {text:n+"절",pauseAfter:PAUSE_AFTER_NUM},
    {text:slowText(text),pauseAfter:last?0:PAUSE_BETWEEN_VERSES}
  ];
}

function renderVerses(){
  stopSpeak();
  vbox.innerHTML="";
  cur.verses.forEach(([n,text])=>{
    const card=document.createElement("div");card.className="vcard";
    const num=document.createElement("div");num.className="vnum";num.textContent=n;
    const t=document.createElement("div");t.className="vtext";
    const words=text.split(" ");
    words.forEach((w,i)=>{
      const span=document.createElement("span");span.className="w";
      if((mode==="first"||mode==="pic")&&w.length>1){
        span.classList.add("first");
        span.innerHTML=esc(w[0])+'<span class="rest">'+esc(w.slice(1))+'</span>';
        span.addEventListener("click",()=>span.classList.toggle("first"));
        span.addEventListener("click",function fix(){ if(!span.classList.contains("first")) span.textContent=w; });
      }else if(mode==="hide"&&Math.random()<0.35&&w.length>1){
        span.classList.add("hid");span.textContent=w;
        span.addEventListener("click",()=>span.classList.toggle("hid"));
      }else{
        span.textContent=w;
        if(mode==="hide"){span.addEventListener("click",()=>span.classList.toggle("hid"))}
      }
      t.appendChild(span);
      if(i<words.length-1)t.appendChild(document.createTextNode(" "));
    });
    const sp=document.createElement("button");sp.className="vspeak";sp.textContent="🔊";
    sp.setAttribute("aria-label",n+"절 읽어주기");
    sp.addEventListener("click",()=>speakSeq([
      {text:verseTitle(cur.ref,n),pauseAfter:PAUSE_AFTER_NUM},
      {text:slowText(text),pauseAfter:0}
    ],sp,"⏸"));
    const picset=PICS[cur.id];
    if(mode==="pic"&&picset&&picset[n]){
      card.classList.add("withpic");
      const pv=document.createElement("div");pv.className="vpic";pv.innerHTML=picset[n];
      const row=document.createElement("div");row.className="vrow";
      row.appendChild(num);row.appendChild(t);row.appendChild(sp);
      card.appendChild(pv);card.appendChild(row);
    }else{
      card.appendChild(num);card.appendChild(t);card.appendChild(sp);
    }
    vbox.appendChild(card);
  });
}
document.getElementById("btn-random").addEventListener("click",renderVerses);

document.getElementById("btn-story").addEventListener("click",function(){
  if(cur&&cur.story)speakSeq([{text:"말씀 이야기. "+cur.st+". "+cur.story,pauseAfter:0}],this,"⏸");
});

document.getElementById("btn-listen").addEventListener("click",function(){
  const segs=[{text:refSpeech(cur.ref)+" 말씀",pauseAfter:PAUSE_BETWEEN_VERSES}];
  cur.verses.forEach(([n,t],i)=>{
    segs.push(...verseSegments(n,t,i===cur.verses.length-1));
  });
  speakSeq(segs,this,"⏸ 멈추기");
});

const btnDone=document.getElementById("btn-done");
function updateDoneBtn(){
  const d=!!done[cur.id];
  btnDone.classList.toggle("off",!d);
  btnDone.textContent=d?"암송 완료! 🌟":"암송 완료 ✔";
}
btnDone.addEventListener("click",()=>{
  done[cur.id]=!done[cur.id];
  if(!done[cur.id])delete done[cur.id];
  saveDone(done);updateDoneBtn();
  const c=document.getElementById("cheer");
  if(done[cur.id]){c.classList.add("show")}else{c.classList.remove("show")}
});

renderHome();
