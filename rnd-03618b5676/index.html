<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>R&D 세액공제 점검표 v1.1 · 원제우세무사사무소</title>
<style>:root{--navy:#203864;--blue:#2f5ca8;--lb:#edf1fa;--line:#c7cfdd;--tx:#1d2433;--mu:#6b7280;--ok:#1f7a4d}
*{box-sizing:border-box}body{margin:0;background:#f3f5f9;color:var(--tx);font:400 16px/1.7 'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;word-break:keep-all}
header{background:var(--navy);color:#fff;padding:18px 16px 14px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:18px}header p{margin:2px 0 8px;font-size:12px;opacity:.8}
.pb{height:8px;background:#ffffff33;border-radius:4px;overflow:hidden}.pb i{display:block;height:100%;width:0;background:#7ed6a5;transition:width .2s}
#pt{font-size:12px;margin-top:4px}
main{max-width:760px;margin:0 auto;padding:14px 12px 60px}
section{background:#fff;border:1px solid var(--line);border-radius:10px;margin:14px 0;padding:6px 14px 12px}
h2{font-size:16px;color:var(--navy);margin:10px 0 4px}
.sub{font-size:12px;color:var(--mu);margin:0 0 6px}
label{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid #eef0f5;cursor:pointer}
label:first-of-type{border-top:0}
input{width:20px;height:20px;margin-top:3px;flex:none;accent-color:var(--blue)}
input:checked+span{color:var(--mu);text-decoration:line-through}
.note{background:var(--lb);border-radius:8px;padding:10px 12px;font-size:13px;margin:10px 0}
.btns{display:flex;gap:8px;margin-top:14px}button{flex:1;padding:11px;border:1px solid var(--line);background:#fff;border-radius:8px;font:inherit;cursor:pointer}
@media print{header{position:static}.btns{display:none}}</style></head><body>
<header><h1>R&D 세액공제 점검표 (직원용)</h1><p>조세특례제한법 제10조 · 법인세 신고 전 점검 · v1.1</p><div class="pb"><i id="bar"></i></div><div id="pt"></div></header>
<main>
<div class="note">체크 상태는 이 기기·브라우저에만 저장됩니다. 업체 정보는 입력하지 않으며, 공통 점검 항목만 담았습니다. 새 업체를 시작할 때는 맨 아래 ‘초기화’를 누르세요.</div>
<section data-k="a"><h2>A. 연구소 기본 자료</h2><p class="sub">수령 시 확인</p>
<label><input type="checkbox"><span>연구소(전담부서) 인정서 — 인정일·취소일 확인</span></label>
<label><input type="checkbox"><span>최근 변경신고 이력과 처리일(rnd.or.kr 신고내역)</span></label>
<label><input type="checkbox"><span>연구개발활동조사표 제출 내역(매년 4월 말)</span></label>
<label><input type="checkbox"><span>연구 공간 도면·사진(칸막이·출입문·기자재)</span></label></section>
<section data-k="b"><h2>B. 연구인력·인건비</h2>
<label><input type="checkbox"><span>연구인력 명단(직위, 전담요원 여부, 입·퇴사일, 신고일)</span></label>
<label><input type="checkbox"><span>급여대장·원천징수 자료와 인건비 일치</span></label>
<label><input type="checkbox"><span>과제별 연구 투입시간 기록(소정근로시간이 아닌지)</span></label>
<label><input type="checkbox"><span>겸직(행정·영업·생산) 여부</span></label>
<label><input type="checkbox"><span>지분 10% 초과 주주·지배주주 임원이 포함되지 않았는지</span></label></section>
<section data-k="c"><h2>C. 연구과제·증빙</h2>
<label><input type="checkbox"><span>과제별 연구개발계획서·보고서(연구노트는 신성장·국가전략 공제 시)</span></label>
<label><input type="checkbox"><span>연구일지(결재 완료본)·연구 사진</span></label>
<label><input type="checkbox"><span>과제별 기술구분(01 신성장·원천 / 02 국가전략 / 03 일반)</span></label>
<label><input type="checkbox"><span>제외 활동 여부(단순 보완, 위탁 수행, 시장조사, 환경디자인)</span></label>
<label><input type="checkbox"><span>재료비: 세금계산서와 재료 사용대장(일자·과제·수량·용도) 대조, 연구용 시작품과 양산·납품용 구분</span></label>
<label><input type="checkbox"><span>위탁비용이 사업운영 시스템(ERP 등)이 아닌지</span></label>
<label><input type="checkbox"><span>정부·지자체 지원금 수령 여부</span></label></section>
<section data-k="d"><h2>D. 위하고 입력·계산</h2>
<label><input type="checkbox"><span>연구소 현황 칸 입력(빈칸 출력 금지)</span></label>
<label><input type="checkbox"><span>인건비명세(부표 4)와 발생명세 합계 일치</span></label>
<label><input type="checkbox"><span>직전 4년 발생액 입력 후 증가분·당기분 비교</span></label>
<label><input type="checkbox"><span>공통비용 안분(일반·신성장·국가전략) 확인</span></label>
<label><input type="checkbox"><span>검토서식 오류 없음</span></label></section>
<section data-k="e"><h2>E. 서식 연계·신고</h2>
<label><input type="checkbox"><span>세액공제신청서·법인세 별지 서식 금액 일치</span></label>
<label><input type="checkbox"><span>최저한세·이월공제는 조문 원문(law.go.kr) 확인 후 판단</span></label>
<label><input type="checkbox"><span>업체에 증빙 5년 보관 안내(안내문 전달)</span></label></section>
<div class="btns"><button onclick="window.print()">인쇄</button><button onclick="rs()">초기화</button></div>
</main>
<script>
var K='rnd-check-v1',cs=[].slice.call(document.querySelectorAll('input'));
function ld(){try{return JSON.parse(localStorage.getItem(K)||'[]')}catch(e){return[]}}
function sv(a){try{localStorage.setItem(K,JSON.stringify(a))}catch(e){}}
function up(){var n=cs.filter(function(c){return c.checked}).length;document.getElementById('bar').style.width=(n/cs.length*100)+'%';document.getElementById('pt').textContent=n+' / '+cs.length+' 완료'}
var s=ld();cs.forEach(function(c,i){c.checked=s.indexOf(i)>-1;c.onchange=function(){sv(cs.map(function(x,j){return x.checked?j:-1}).filter(function(j){return j>-1}));up()}});up();
function rs(){if(confirm('모든 체크를 해제할까요?')){cs.forEach(function(c){c.checked=false});sv([]);up()}}
</script></body></html>
